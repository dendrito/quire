<title>Quire PDF Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
<style>
/* Layout: a quiet desk. The paper fills the window; tools float in frosted capsules and appear only when needed. */
:root{
  --desk:#e6e7ea; --glass:rgba(255,255,255,.8); --solid:#ffffff; --fg:#111214; --muted:#6b6e76; --faint:#a0a3ab;
  --line:rgba(17,18,20,.09); --hover:rgba(17,18,20,.055); --hover2:rgba(17,18,20,.1); --on:#16171a; --on-ink:#ffffff;
  --accent:#2b5cff; --accent-soft:rgba(43,92,255,.12); --danger:#d93a2b; --paper:#ffffff;
  --shadow:0 0 0 1px rgba(17,18,20,.06),0 2px 4px rgba(17,18,20,.04),0 12px 32px rgba(17,18,20,.1);
  --page-shadow:0 0 0 1px rgba(17,18,20,.04),0 2px 4px rgba(17,18,20,.04),0 10px 30px rgba(17,18,20,.09);
  --scrim:rgba(230,231,234,.55);
  --f-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#141517; --glass:rgba(34,35,39,.8); --solid:#232428; --fg:#ededef; --muted:#9b9da5; --faint:#676a72;
  --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.06); --hover2:rgba(255,255,255,.11); --on:#ededef; --on-ink:#111214;
  --accent:#7090ff; --accent-soft:rgba(112,144,255,.17); --danger:#ff6b5e;
  --shadow:0 0 0 1px rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.45);
  --page-shadow:0 2px 6px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.45); --scrim:rgba(20,21,23,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#141517; --glass:rgba(34,35,39,.8); --solid:#232428; --fg:#ededef; --muted:#9b9da5; --faint:#676a72;
  --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.06); --hover2:rgba(255,255,255,.11); --on:#ededef; --on-ink:#111214;
  --accent:#7090ff; --accent-soft:rgba(112,144,255,.17); --danger:#ff6b5e;
  --shadow:0 0 0 1px rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.45);
  --page-shadow:0 2px 6px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.45); --scrim:rgba(20,21,23,.55); color-scheme:dark}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font:13px/1.45 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:var(--shadow)}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* top bar */
.top{display:flex;align-items:center;gap:6px;height:50px;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 12px;border-radius:9px;color:var(--muted);cursor:pointer;max-width:230px;white-space:nowrap;font-weight:500;transition:background .15s,color .15s}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:var(--hover);color:var(--fg)}
.tab.on{background:var(--solid);color:var(--fg);box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.06)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.tab button{border:0;background:none;width:22px;height:22px;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.tab:hover button,.tab.on button{opacity:1}
.tab button:hover{background:var(--hover2);color:var(--fg)}
.topacts{display:flex;gap:4px;align-items:center;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;border:0;border-radius:9px;background:var(--hover);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--hover2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--on);color:var(--on-ink)}
.btn.primary:hover{opacity:.88}
.btn.ghost{background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger-o{background:none;box-shadow:inset 0 0 0 1px var(--danger);color:var(--danger)}
.btn:disabled{opacity:.35;cursor:default}
.btn svg{width:16px;height:16px}
.btn .mobile-save{display:none}
@media (max-width:760px){.btn .mobile-save{display:block}}
.icon-btn{border:0;background:none;border-radius:9px;width:32px;height:32px;display:inline-grid;place-items:center;cursor:pointer;color:var(--fg);transition:background .15s}
.icon-btn:hover{background:var(--hover)}
.icon-btn:disabled{opacity:.3;cursor:default;background:none}
.icon-btn.on{background:var(--hover2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm{width:26px;height:26px;border-radius:7px}
.icon-btn.sm svg{width:15px;height:15px}

/* workspace */
.main{display:grid;grid-template-columns:150px minmax(0,1fr);min-height:0;position:relative;transition:grid-template-columns .25s ease}
.main.no-thumbs{grid-template-columns:0 minmax(0,1fr)}
.thumbs{overflow:auto;padding:6px 8px 60px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:10px;scrollbar-width:none;min-width:0}
.thumbs::-webkit-scrollbar{display:none}
.main.no-thumbs .thumbs{visibility:hidden;padding:0;overflow:hidden}
.thumb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;border-radius:10px;cursor:pointer;user-select:none;transition:background .15s}
.thumb:hover{background:var(--hover)}
.thumb canvas{background:var(--paper);box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.08);border-radius:2px;display:block;transition:box-shadow .15s}
.thumb .n{font:500 10.5px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.thumb.sel{background:var(--accent-soft)}
.thumb.cur canvas{box-shadow:0 0 0 2px var(--accent),0 2px 8px rgba(0,0,0,.1)}
.thumb.cur .n{color:var(--accent)}
.thumb.drop{box-shadow:0 -2px 0 var(--accent)}
.stage{position:relative;min-width:0;min-height:0}
.viewer{position:absolute;inset:0;overflow:auto;scrollbar-width:thin}
#pages{display:flex;flex-direction:column;align-items:center;gap:28px;padding:78px 32px 120px;width:max-content;min-width:100%;box-sizing:border-box}
.page{position:relative;background:var(--paper);box-shadow:var(--page-shadow);border-radius:2px;flex:none}
.page canvas{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:2px}
.ov{touch-action:none}
.te{position:absolute;z-index:3;min-width:60px;min-height:1.2em;padding:0;margin:0;border:1px dashed var(--accent);border-radius:2px;background:rgba(255,255,255,.9);font-family:Helvetica,Arial,sans-serif;line-height:1.2;resize:none;overflow:hidden;outline:none;white-space:pre}
.viewer.dragging{box-shadow:inset 0 0 0 3px var(--accent)}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.empty .card{max-width:360px;text-align:center;display:grid;gap:14px;justify-items:center}
.empty h2{margin:0;font:600 20px var(--f-ui);letter-spacing:-.02em}
.empty .mark{width:56px;height:70px;border-radius:4px;background:var(--paper);box-shadow:var(--page-shadow);position:relative}
.empty .mark::after{content:"";position:absolute;right:0;top:0;width:16px;height:16px;background:linear-gradient(225deg,var(--desk) 50%,var(--line) 50%)}

/* floating toolbar */
.dock{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;border-radius:14px;z-index:6;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none;box-sizing:border-box}
.dock::-webkit-scrollbar{display:none}
#rtabs{display:flex;gap:2px;flex:none;padding:2px;border-radius:10px;background:var(--hover)}
.rtab{height:28px;padding:0 11px;border-radius:8px;border:0;background:none;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
.rtab:hover{color:var(--fg)}
.rtab.on{background:var(--solid);color:var(--fg);box-shadow:0 0 0 .5px var(--line),0 1px 3px rgba(0,0,0,.1)}
#rbtns{display:flex;align-items:center;gap:1px;flex:none}
.rb{width:34px;height:32px;border-radius:9px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--fg);transition:background .15s,color .15s,transform .1s}
.rb:hover{background:var(--hover)}
.rb:active{transform:scale(.92)}
.rb.on{background:var(--on);color:var(--on-ink)}
.rb svg{width:18px;height:18px}
.sep,.vsep{width:1px;height:18px;background:var(--line);margin:0 5px;flex:none}
/* toolbar labels */
.dock.labels .rb{width:auto;min-width:46px;height:44px;padding:3px 5px 2px;grid-template-rows:20px 13px;gap:1px;place-items:end center}
.dock.labels .rb .rl{font:500 10px/13px var(--f-ui);color:var(--muted);white-space:nowrap;letter-spacing:-.01em}
.dock.labels .rb.on .rl{color:inherit}
.dock.labels .rtab{height:36px}
/* page organiser */
#org{position:fixed;inset:0;z-index:30;background:var(--desk);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.org-top{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--solid);flex-wrap:wrap}
.org-top h2{margin:0;font:600 16px var(--f-ui);letter-spacing:-.015em;white-space:nowrap}
.org-acts{display:flex;align-items:center;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.org-end{display:flex;align-items:center;gap:10px;margin-left:auto}
.org-end input[type=range]{width:110px}
.org-grid{overflow:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--ow,150px),1fr));gap:18px 14px;align-content:start}
.org-cell{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:8px;border-radius:12px;cursor:pointer;user-select:none;position:relative;transition:background .15s}
.org-cell:hover{background:var(--hover)}
.org-pg{max-width:100%;background:var(--paper);box-shadow:0 0 0 1px var(--line),0 2px 8px rgba(0,0,0,.1);border-radius:2px;overflow:hidden}
.org-pg canvas{width:100%;height:100%;display:block}
.org-cell .n{font:500 11px var(--f-mono);color:var(--faint)}
.org-cell.sel{background:var(--accent-soft)}
.org-cell.sel .org-pg{box-shadow:0 0 0 2px var(--accent),0 2px 8px rgba(0,0,0,.12)}
.org-cell.sel .n{color:var(--accent)}
.org-cell.drop-l::before,.org-cell.drop-r::after{content:"";position:absolute;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.org-cell.drop-l::before{left:-9px}.org-cell.drop-r::after{right:-9px}
.org-hint{margin:0;padding:8px 16px 12px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:760px){.org-grid{padding:12px;gap:10px 6px}.org-top .btn .lab{display:none}.org-hint{display:none}.org-end input[type=range]{display:none}.org-top h2{flex:1}#bCmd{display:none}}
dialog:has(.imgdlg){width:min(780px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
.imgdlg{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}
.imgdlg-l{display:flex;flex-direction:column;gap:12px;min-width:0}
.imgdlg-l [data-p]{display:flex;flex-direction:column;gap:10px}
.imgdlg-r{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;background:var(--desk);border-radius:12px;align-self:start}
.imgdlg-r canvas{box-shadow:0 1px 4px rgba(0,0,0,.15)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
@media (max-width:760px){.imgdlg{grid-template-columns:1fr}.imgdlg-r{order:-1}}
.cmb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:44vh;overflow:auto}
.cmb li{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:9px;background:var(--hover);cursor:grab}
.cmb-n{font:500 11px var(--f-mono);color:var(--faint);width:18px;text-align:right;flex:none}
.cmb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.cmb-r{width:78px!important;flex:none;padding:5px 7px!important;background:var(--solid)!important}
#sfit{position:fixed;inset:0;z-index:30;background:var(--desk);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.sf-ctl{display:flex;flex-wrap:wrap;gap:8px 12px;flex:1;min-width:0;align-items:flex-end}
.sf-f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.sf-f .inp{padding:6px 8px;font-size:12.5px;width:auto}
.sf-sum{margin:0;padding:10px 16px 0;font-size:13px;color:var(--ink);text-align:center}
.sf-cell{cursor:default}.sf-pg{background:transparent;box-shadow:none}.sf-pg canvas{cursor:grab;touch-action:none;width:auto!important;height:auto!important;max-width:100%;max-height:240px}
.sf-tag.warn{color:#c2410c}
@media (max-width:760px){#sfGrid{--ow:140px!important}.sf-ctl{gap:6px 8px}.sf-sum{font-size:12px}}
/* command search */
#qlShade{position:fixed;inset:0;z-index:40;background:rgba(10,12,18,.25)}
#ql{position:fixed;z-index:41;top:12vh;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 32px));border-radius:14px;padding:8px;box-sizing:border-box}
#ql input{width:100%;box-sizing:border-box;border:0;outline:none;border-radius:9px;padding:11px 12px;font-size:15px;background:var(--hover);color:var(--fg)}
#ql ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:1px}
#ql li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
#ql li svg{width:17px;height:17px;flex:none;color:var(--muted)}
#ql li.on,#ql li:hover{background:var(--hover2)}
#ql li.none{color:var(--muted);cursor:default;background:none}

/* inspector */
.panel{position:absolute;top:66px;right:max(12px,env(safe-area-inset-right,0px));width:276px;max-height:calc(100% - 66px - 70px);overflow:auto;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:20px;z-index:5;box-sizing:border-box;scrollbar-width:thin;animation:pin .18s ease}
@keyframes pin{from{opacity:0;transform:translateY(-4px)}}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h3{margin:0;font:600 10.5px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.task-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:-2px}
.task-h h3{font:600 15px var(--f-ui);letter-spacing:-.015em;text-transform:none;color:var(--fg)}
.task-h .icon-btn{width:26px;height:26px;color:var(--muted)}
.task-h .icon-btn svg{width:15px;height:15px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:11.5px;color:var(--muted);font-weight:500}
.field input[type=text],.field input[type=search],.field input[type=number],.field input:not([type]),.field select,.field textarea,.inp{border:0;background:var(--hover);border-radius:8px;padding:7px 9px;width:100%;box-sizing:border-box;min-width:0;outline:none;transition:box-shadow .15s,background .15s}
.inp:focus,.field input:focus,.field textarea:focus,.field select:focus{background:var(--solid);box-shadow:0 0 0 2px var(--accent)}
.field textarea{min-height:76px;resize:vertical;line-height:1.45}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.chk input{accent-color:var(--on)}
.muted{color:var(--muted)} .small{font-size:11.5px}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swb{width:18px;height:18px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);background:var(--c);cursor:pointer;padding:0;transition:transform .12s}
.swb:hover{transform:scale(1.15)}
.swb.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 0 0 2px var(--solid),0 0 0 3.5px var(--fg)}
.sw input[type=color]{width:20px;height:20px;border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;min-width:0;accent-color:var(--on)}
.range output{font:500 11.5px var(--f-mono);width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.kbd{font:500 10.5px var(--f-mono);background:var(--hover2);border-radius:4px;padding:1px 4px}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stampb{border:1.5px solid currentColor;border-radius:6px;background:none;padding:5px 4px;font:700 10.5px Helvetica,Arial,sans-serif;letter-spacing:.05em;cursor:pointer;opacity:.55;transition:opacity .15s}
.stampb:hover,.stampb.on{opacity:1}
.stampb.on{box-shadow:0 0 0 2px var(--solid),0 0 0 3.5px currentColor}
.list{list-style:none;margin:0 -6px;padding:0;display:flex;flex-direction:column;gap:1px}
.list li button{width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.list li button:hover{background:var(--hover)}
.list .pg{font:500 10.5px var(--f-mono);color:var(--faint)}
.list .ty{font-weight:500}
.list .tx{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:2/-1}
.chip{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.results{margin:0 -6px;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px}
.results button{width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12px;line-height:1.4}
.results button:hover,.results button.on{background:var(--hover)}
.results b{background:var(--accent-soft);color:var(--fg);font-weight:600;border-radius:3px;padding:0 1px}
.sigprev{background:var(--paper);border-radius:10px;padding:10px;display:grid;place-items:center;min-height:60px;box-shadow:inset 0 0 0 1px var(--line)}
.sigprev .muted{color:#6b6e76}
.sigprev img{max-height:64px}
.prog{height:4px;border-radius:2px;background:var(--hover2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

/* page & zoom pill */
.pill{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px 6px;border-radius:12px;z-index:6;font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.pill input{width:30px;height:24px;text-align:center;border:0;background:var(--hover);border-radius:6px;font:inherit;color:var(--fg);outline:none}
.pill input:focus{box-shadow:0 0 0 2px var(--accent)}
.pill .pgn{display:flex;align-items:center;gap:5px;padding:0 4px}
.pill select{border:0;background:none;font:inherit;color:var(--fg);cursor:pointer;height:26px;outline:none;-webkit-appearance:none;appearance:none;padding:0 4px;text-align:center}
.txt-btn{border:0;background:none;height:26px;padding:0 8px;border-radius:7px;font:500 12px var(--f-ui);color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.txt-btn:hover{background:var(--hover);color:var(--fg)}

/* overlays */

  cv.addEventListener('pointerdown', e => { const k = near(at(e)); if (k < 0) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); SC.drag = { k }; scDraw(); });
  cv.addEventListener('pointermove', e => {
    const p = at(e); if (!SC.drag) { cv.style.cursor = near(p) >= 0 ? 'grab' : 'default'; return; }
    const pg = SC.pages[SC.sel], f = SC.fit; pg.quad[SC.drag.k] = [Math.max(0, Math.min(pg.src.width, (p[0] - f.ox) / f.s)), Math.max(0, Math.min(pg.src.height, (p[1] - f.oy) / f.s))]; pg.found = true; scDraw();
  });
  const up = () => { if (!SC.drag) return; SC.drag = null; const pg = SC.pages[SC.sel]; if (pg) { pg.quad = orderQuad(pg.quad); scThumb(pg); scStrip(); } scDraw(); };

}
function scOpen() {
  if (!SC.built) scBuild(); closeTextEditor(true);
  SC.open = true; scE('scan').hidden = false; SC.armed = true; SC.stable = 0; SC.state = 'search';
  scSelect(-1); if (!SC.stream && !scUseHw()) scStartCam(); if (!SC.raf) SC.raf = requestAnimationFrame(scTick);
}
async function scClose(force) {
  if (!force && SC.pages.length) {
    const n = SC.pages.length; const r = await modal({ title: 'Discard scanned pages?', body: `<p style="margin:0">${n} scanned page${n > 1 ? 's' : ''} will be lost. Use Create PDF to keep ${n > 1 ? 'them' : 'it'}.</p>`, actions: [{ label: 'Keep scanning', value: null }, { label: 'Discard', danger: true, value: 'x' }] });
    if (!r) return;
  }
  scHwStop(); SC.open = false; SC.timerOn = false; SC.drag = null; scStopCam(); scE('scan').hidden = true; SC.pages = []; SC.sel = -1; SC.insertAt = null; SC.err = '';

async function scBuildPdf() {
  const nd = await PDFDocument.create(); nd.setTitle('Scan ' + today()); nd.setCreator('Quire PDF Studio'); nd.setProducer('Quire PDF Studio');
  for (let k = 0; k < SC.pages.length; k++) {
    const pg = SC.pages[k]; $('#busyMsg').textContent = `Preparing page ${k + 1} of ${SC.pages.length}…`; await new Promise(r => setTimeout(r, 0));
    const out = scOut(pg); const L = scLayout(pg, out.width, out.height); const cc = cnv(L.crop.w, L.crop.h); cc.getContext('2d').drawImage(out, L.crop.x, L.crop.y, L.crop.w, L.crop.h, 0, 0, cc.width, cc.height);
    const img = pg.filter === 'bw' ? await nd.embedPng(await canvasBytes(cc, 'image/png')) : await nd.embedJpg(await canvasBytes(cc, 'image/jpeg', .86));
    const p = nd.addPage([L.pw * MM, L.ph * MM]); p.drawImage(img, { x: L.x * MM, y: (L.ph - L.y - L.h) * MM, width: L.w * MM, height: L.h * MM });
  }

}
async function scFinish(add) {
  const n = SC.pages.length; if (!n) { toast('Capture or import a page first'); return; }
  busy('Preparing scan…'); let bytes;
  try { bytes = await scBuildPdf(); } catch (e) { console.error(e); unbusy(); toast('Could not make the PDF: ' + (e.message || e)); return; }
  unbusy(); const d = add ? cur() : null; const ocr = SC.auto.ocr; await scClose(true);
  if (d) {
    const at = d.cur + 1;
    const ok = await editBytes(`Added ${n} scanned page${n > 1 ? 's' : ''}`, async (pdf, dd) => { const src = await PDFDocument.load(bytes); const cps = await pdf.copyPages(src, src.getPageIndices()); cps.forEach((p, k) => { pdf.insertPage(at + k, p); dd.annots.splice(at + k, 0, []); }); });
    if (ok) { d.sel = new Set([at]); markThumbs(); gotoPage(at); if (ocr) startOcr(); }
  } else {
    const nd = await openBytes(bytes, `Scan ${new Date().toISOString().slice(0, 10)}.pdf`); if (nd) { nd.dirty = true; renderTabs(); if (ocr) { toast(`Scanned ${n} page${n > 1 ? 's' : ''}. Making the text searchable…`, 4000); startOcr(); } else toast(`Scanned ${n} page${n > 1 ? 's' : ''}. Run OCR from the Tools ribbon to make the text searchable.`, 5000); }
  }
}

/* ================= wiring ================= */
function wire() {
  const MOD = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? '⌘' : 'Ctrl+';
  $('#bUndo').innerHTML = svg('undo'); $('#bRedo').innerHTML = svg('redo'); $('#bInfo').innerHTML = svg('panel');
  $('#bOpen').innerHTML = svg('open') + '<span class="lab">Open</span>'; $('#bScan').innerHTML = svg('camera') + '<span class="lab">Scan</span>'; $('#bSave').innerHTML = '<span class="lab">Save</span>' + svg('save').replace('<svg', '<svg class="mobile-save"');
  $('#zIn').innerHTML = svg('plus'); $('#zOut').innerHTML = svg('minus'); $('#bThumbs').innerHTML = svg('side');
  const tips = { bThumbs: ['Pages', ''], bUndo: ['Undo', MOD + 'Z'], bRedo: ['Redo', MOD + 'Y'], bInfo: ['Document & markup', ''], bScan: ['Scan pages with the camera', ''], bOpen: ['Open', MOD + 'O'], bSave: ['Save', MOD + 'S'] };
  for (const [id, [t, k]] of Object.entries(tips)) { $('#' + id).dataset.tip = t; $('#' + id).dataset.key = k; }
  const tip = $('#tip');
  document.addEventListener('pointerover', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t || e.pointerType === 'touch') { tip.hidden = true; return; }
    tip.innerHTML = esc(t.dataset.tip) + (t.dataset.key ? `<kbd>${esc(t.dataset.key)}</kbd>` : ''); tip.hidden = false;
    const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight; const below = r.bottom + h + 12 < innerHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
    tip.style.top = (below ? r.bottom + 8 : r.top - h - 8) + 'px';
  });
  document.addEventListener('pointerdown', () => tip.hidden = true, true);
  if (!pref.get('thumbs', innerWidth > 1000)) $('#main').classList.add('no-thumbs');
  $('#bInfo').onclick = () => { S.info = !S.info; pref.set('info', S.info); if (S.info) S.task = null; renderPanel(); };
  $('#bUndo').onclick = undo; $('#bRedo').onclick = redo; $('#bSave').onclick = saveDialog;
  $('#bScan').onclick = () => scOpen();
  $('#bOpen').onclick = async () => { const f = await pickFile('#fileIn'); if (f) handleFiles(f); };
  $('#zIn').onclick = () => zoomBy(1.2); $('#zOut').onclick = () => zoomBy(1 / 1.2);
  $('#zSel').onchange = e => setZoom(+e.target.value);
  $('#zFitW').onclick = () => cur() && setZoom(fitZoom(cur(), 'width'), true);$('#zFitP').onclick = () => cur() && setZoom(fitZoom(cur(), 'page'));
  $('#pgIn').onchange = e => gotoPage((parseInt(e.target.value) || 1) - 1, true);
  $('#bThumbs').onclick = () => {
    if (innerWidth <= 760) { $('#thumbs').classList.toggle('show'); return; }
    const off = $('#main').classList.toggle('no-thumbs'); pref.set('thumbs', !off);
  };
  let raf = 0; $('#viewer').addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; trackPage(); }); });
  $('#viewer').addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1); } }, { passive: false });
  const V = $('#viewer');
  window.addEventListener('dragover', e => { if (e.dataTransfer && e.dataTransfer.types.includes('Files')) { e.preventDefault(); V.classList.add('dragging'); } });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) V.classList.remove('dragging'); });
  window.addEventListener('drop', e => { V.classList.remove('dragging'); if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); handleFiles([...e.dataTransfer.files]); } });
  let rt, lastW = 0; new ResizeObserver(() => { const w = $('#viewer').clientWidth; if (Math.abs(w - lastW) < 2) return; lastW = w; clearTimeout(rt); rt = setTimeout(() => { const d = cur(); if (d) setZoom(d.autoFit ? fitZoom(d, 'width') : d.zoom, d.autoFit); }, 120); }).observe($('#viewer'));
  document.addEventListener('keydown', e => {
    if (SC.open) { scKey(e); return; }
    const tg = e.target; const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName) || tg.isContentEditable; const mod = e.ctrlKey || e.metaKey; const k = e.key.toLowerCase();
    if ($('#dlg').open) return;
    if (mod && k === 's') { e.preventDefault(); saveDialog(); return; }
    if (mod && k === 'o') { e.preventDefault(); $('#bOpen').click(); return; }
    if (mod && k === 'f') { e.preventDefault(); if (cur()) openTask('search'); return; }
    if (typing) return;
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); redo(); return; }
    if (mod && (k === '=' || k === '+')) { e.preventDefault(); zoomBy(1.2); return; }
    if (mod && k === '-') { e.preventDefault(); zoomBy(1 / 1.2); return; }
    if (mod && k === '0') { e.preventDefault(); cur() && setZoom(fitZoom(cur(), 'width')); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) { e.preventDefault(); deleteSel(); return; }
    if (e.key === 'Escape') { if (S.task) closeTask(); else if (S.sel) setSel(null); else setTool('select'); return; }
    if (e.key === 'PageDown') { e.preventDefault(); cur() && gotoPage(cur().cur + 1); return; }
    if (e.key === 'PageUp') { e.preventDefault(); cur() && gotoPage(cur().cur - 1); return; }
    if (!mod && !e.altKey && cur()) { const t = TOOLS.find(t => t.key && t.key === k); if (t) setTool(t.id); }
  });
}
async function handleFiles(files) {
  const pdfs = files.filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)); const imgs = files.filter(f => /^image\//.test(f.type));
  for (const f of pdfs) await openBytes(new Uint8Array(await f.arrayBuffer()), f.name);
  if (imgs.length) await imagesToPdf(imgs);
  if (!pdfs.length && !imgs.length) toast('Quire opens PDF files and images (PNG, JPEG, WebP, GIF).');
}
(async function init() {

  if (window.quireDesktop) { // Return nothing to the preload bridge: Electron would try to copy the returned document object into the other world and freeze.
    window.quireDesktop.onOpenFile(f => { openBytes(new Uint8Array(f.data), f.name); }); window.quireDesktop.ready(); }
  try { const s = await makeSample(); const d = await openBytes(s.bytes, 'Sample - Studio Rental Agreement.pdf', { annots: s.annots }); if (d) { redrawAll(); renderPanel(); } }
  catch (e) { console.error(e); toast('Could not create the sample document: ' + e.message); }
})();
