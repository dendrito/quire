# Builds the .dmg on GitHub's macOS runners, so you don't need a Mac to build it.
# Push this folder to a GitHub repository, then run the workflow from the Actions tab.
name: Build macOS app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Quire-PDF-Studio-mac
          path: dist/*.dmg
