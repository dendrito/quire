# Builds the Windows installer and portable app on GitHub's Windows runners, so you don't need a PC to build it.
# Push this folder to a GitHub repository, then run the workflow from the Actions tab.
name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Quire-PDF-Studio-windows
          path: dist/*.exe
