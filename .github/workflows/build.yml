# Builds Quire for every platform with tools/build.js, the same command you can run on your own computer:
#   web       Quire Lite and Pro as single web pages                   (every run)
#   android   Quire Lite .apk for Android tablets                      (every run)
#   mac       .dmg for Apple silicon and Intel, Lite and Pro           (on demand and version tags)
#   windows   installer and portable .exe, x64 and arm64, Lite and Pro (on demand and version tags)
#   ipad      checks the iPad app compiles; install it from Xcode      (on demand and version tags)
# Mac minutes count ten times and Windows twice, so pull requests only build the web pages and Android.
#
# To get the apps without installing anything: Actions > Build > Run workflow. When it finishes, every file is on the
# repository's Releases page under "Latest test build" (a version tag like v1.3.0 makes a release of its own instead).
# Each platform's files are also kept for 14 days on the run's page.
name: Build
on:
  workflow_dispatch:
  pull_request:
    paths: ['web/**', 'mac/**', 'windows/**', 'mobile/**', 'models/**', 'tools/**', 'branding/**', '.github/workflows/build.yml']
  push:
    tags: ['v*']
    paths: ['web/**', 'mac/**', 'windows/**', 'mobile/**', 'models/**', 'tools/**', 'branding/**', '.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.js web
      - uses: actions/upload-artifact@v4
        with:
          name: quire-web
          path: build/web/
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: node tools/build.js android
      - uses: actions/upload-artifact@v4
        with:
          name: quire-android
          path: build/android/
          retention-days: 14

  mac:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [lite, pro]
    name: mac (${{ matrix.edition }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Spotlight indexing keeps a new disk image busy, so hdiutil cannot detach it.
      - name: Stop Spotlight indexing
        run: sudo mdutil -a -i off || true
      - run: node tools/build.js mac ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: quire-mac-${{ matrix.edition }}
          path: build/mac/
          retention-days: 14

  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [lite, pro]
    name: windows (${{ matrix.edition }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.js windows ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: quire-windows-${{ matrix.edition }}
          path: build/windows/
          retention-days: 14

  ipad:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.js ipad

  # Puts every file on one Releases page: "latest" (replaced on each run), or the version tag's own release.
  release:
    if: github.event_name != 'pull_request'
    needs: [web, android, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Publish the downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir files
          find parts -type f ! -name SHA256SUMS.txt ! -name source-commit.txt -exec cp {} files/ \;
          cat parts/*/SHA256SUMS.txt > files/SHA256SUMS.txt
          ls -lh files
          short=${GITHUB_SHA::7}
          notes="Built from $short ($GITHUB_REF_NAME).
          Mac: the .dmg ending arm64 for Apple silicon (M1 and later), x64 for Intel. The first time, right-click the app > Open.
          Windows: Setup to install, Portable to run without installing; x64 for most PCs, arm64 for Snapdragon laptops.
          Android tablets: Quire-Lite-Android.apk. Browser: quire-lite.html or quire-pro.html, opened in Chrome, Edge or Safari.
          Quire Lite and Quire Pro install side by side. SHA256SUMS.txt lists each file's checksum."
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" files/* --title "Quire $GITHUB_REF_NAME" --notes "$notes"
          else
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest files/* --target "$GITHUB_SHA" --prerelease --title "Latest test build" --notes "$notes"
          fi
