# Publishes Quire Lite's web build as a website on Cloudflare Pages: https://quire-lite.pages.dev
# Runs on demand from the Actions tab, and when the web app changes on this branch.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Cloudflare dashboard
name: Publish Quire Lite website
on:
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-oh7c7y']
    paths: ['web/**', 'tools/editions*', 'tools/build-editions.js', '.github/workflows/deploy-lite-site.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the Lite page
        run: node tools/build-editions.js --check --site
      - name: Check the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then run this again."; exit 1; fi
      - name: Publish to quire-lite.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.114.0 pages project create quire-lite --production-branch=main || true
          npx --yes wrangler@3.114.0 pages deploy web/site/lite --project-name=quire-lite --branch=main --commit-dirty=true
