# Builds the macOS app (.dmg for Apple silicon and Intel) on GitHub's macOS runners, so no Mac is needed to build it.
# Runs on demand from the Actions tab, on version tags, and when the Mac app or the web app changes on this branch.
# The app is not signed with an Apple Developer ID: the first time, open it with right-click > Open.
name: Build macOS app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/project-thread-vzqdhg']
    paths: ['mac/**', 'web/**', 'models/**', '.github/workflows/build-mac.yml']
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the current web app
        run: cp ../web/quire-pdf-studio.html src/quire.html
      - run: npm install --no-audit --no-fund
      # Spotlight indexing keeps the new disk image busy, and two images built at once share one volume name, so
      # hdiutil cannot detach them: indexing is turned off and Apple silicon and Intel are built one after the other.
      - name: Stop Spotlight indexing
        run: sudo mdutil -a -i off || true
      - name: Build for Apple silicon
        run: node scripts/vendor.js && npx electron-builder --mac dmg --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build for Intel
        run: npx electron-builder --mac dmg --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Quire-PDF-Studio-mac
          path: mac/dist/*.dmg
          if-no-files-found: error
