# Builds the Windows installer and portable app on GitHub's Windows runners.
# Runs on demand from the Actions tab, and on version tags.
name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Quire-PDF-Studio-windows
          path: windows/dist/*.exe
